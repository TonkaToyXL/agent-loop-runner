<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#122b24"/>
      <stop offset="68%" stop-color="#0b1312"/>
      <stop offset="100%" stop-color="#080c0b"/>
    </radialGradient>
    <radialGradient id="rim" cx="78%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#10a37f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="20%" y1="15%" x2="82%" y2="85%">
      <stop offset="0%" stop-color="#e9bc9c"/>
      <stop offset="65%" stop-color="#cf9b78"/>
      <stop offset="100%" stop-color="#ad7957"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202a29"/>
      <stop offset="100%" stop-color="#101616"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .blink { transform-origin: 128px 116px; animation: blink 5.8s ease-in-out 2.2s infinite; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.12); } }
    </style>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#rim)"/>
  <!-- Tailored dark blazer + lapels -->
  <path d="M48 256 C54 202, 82 184, 128 184 C174 184, 202 202, 208 256 Z" fill="url(#blazer)" stroke="#10a37f" stroke-opacity="0.4" stroke-width="2.2"/>
  <path d="M98 188 L128 242 L158 188 L148 256 L108 256 Z" fill="#0d1313"/>
  <path d="M94 188 L116 226 L102 232 L84 198 Z" fill="#273432" stroke="#10a37f" stroke-opacity="0.25" stroke-width="1.2"/>
  <path d="M162 188 L140 226 L154 232 L172 198 Z" fill="#273432" stroke="#10a37f" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- Neck -->
  <path d="M108 162 H148 L151 196 Q128 210 105 196 Z" fill="#c18d6b"/>
  <!-- Ears -->
  <ellipse cx="81" cy="122" rx="8" ry="14" fill="#cf9b78" stroke="#0d1313" stroke-width="2"/>
  <ellipse cx="175" cy="122" rx="8" ry="14" fill="#dda886" stroke="#10a37f" stroke-opacity="0.65" stroke-width="2"/>
  <!-- Face -->
  <path d="M84 96 C84 60, 172 60, 172 96 C172 138, 158 168, 128 176 C98 168, 84 138, 84 96 Z" fill="url(#skin)" stroke="#18201f" stroke-width="2.2"/>
  <!-- Emerald rim light -->
  <path d="M168 96 C169 134, 156 161, 134 172" fill="none" stroke="#10a37f" stroke-width="3" stroke-linecap="round" opacity="0.82" filter="url(#glow)"/>
  <!-- Neat executive hair with subtle silver temples -->
  <path d="M78 106 C76 66, 98 44, 130 44 C162 44, 180 66, 178 106 C171 84, 156 72, 132 72 C108 72, 89 82, 78 106 Z" fill="#1d2226" stroke="#0d1112" stroke-width="2"/>
  <path d="M81 94 L87 104 M175 94 L169 104" stroke="#8fa6a2" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M120 46 C152 46, 174 62, 178 94" fill="none" stroke="#10a37f" stroke-width="2.5" stroke-linecap="round" opacity="0.75" filter="url(#glow)"/>
  <!-- Warm confident brows -->
  <path d="M97 103 Q109 99 120 103" fill="none" stroke="#22282a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M136 103 Q147 99 159 103" fill="none" stroke="#22282a" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Steady perceptive eyes -->
  <g class="blink">
    <ellipse cx="109" cy="116" rx="6.8" ry="4.4" fill="#f7fbfa"/>
    <circle cx="109" cy="116" r="3.3" fill="#142420"/>
    <circle cx="110.4" cy="114.6" r="1.2" fill="#5fe3be"/>
    <ellipse cx="147" cy="116" rx="6.8" ry="4.4" fill="#f7fbfa"/>
    <circle cx="147" cy="116" r="3.3" fill="#142420"/>
    <circle cx="148.4" cy="114.6" r="1.2" fill="#5fe3be"/>
  </g>
  <!-- Nose & warm trustworthy smile -->
  <path d="M128 117 L126 136 Q128 139 133 137" fill="none" stroke="#9e6d4f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M114 150 Q128 158 142 150" fill="none" stroke="#7c4b34" stroke-width="2.7" stroke-linecap="round"/>
  <!-- Right shoulder emerald rim -->
  <path d="M174 194 C192 208, 200 230, 205 256" fill="none" stroke="#10a37f" stroke-width="2.6" opacity="0.75" filter="url(#glow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#221933"/>
      <stop offset="68%" stop-color="#0f0d18"/>
      <stop offset="100%" stop-color="#090910"/>
    </radialGradient>
    <radialGradient id="rim" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#b78bff" stop-opacity="0.44"/>
      <stop offset="60%" stop-color="#b78bff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b78bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#f1d2be"/>
      <stop offset="65%" stop-color="#dbb197"/>
      <stop offset="100%" stop-color="#be8f74"/>
    </linearGradient>
    <linearGradient id="knit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262336"/>
      <stop offset="100%" stop-color="#13121d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .blink { transform-origin: 128px 116px; animation: blink 6.4s ease-in-out 1.4s infinite; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.1); } }
    </style>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#rim)"/>
  <!-- Architectural mock-neck coat -->
  <path d="M54 256 C60 206, 84 186, 128 186 C172 186, 196 206, 202 256 Z" fill="url(#knit)" stroke="#b78bff" stroke-opacity="0.38" stroke-width="2.2"/>
  <path d="M99 178 H157 L162 214 Q128 224 94 214 Z" fill="#191726" stroke="#2d2942" stroke-width="1.6"/>
  <!-- Neck -->
  <path d="M111 160 H145 V184 Q128 192 111 184 Z" fill="#cfa389"/>
  <!-- Hair back -->
  <path d="M74 114 C72 62, 98 42, 128 42 C158 42, 184 62, 182 114 L176 146 L80 146 Z" fill="#141320"/>
  <!-- Ears -->
  <ellipse cx="83" cy="122" rx="7" ry="13" fill="#e5beaa" stroke="#b78bff" stroke-opacity="0.55" stroke-width="1.8"/>
  <ellipse cx="173" cy="122" rx="7" ry="13" fill="#d3a68c" stroke="#141320" stroke-width="1.8"/>
  <!-- Face -->
  <path d="M86 98 C86 64, 170 64, 170 98 C170 136, 155 166, 128 174 C101 166, 86 136, 86 98 Z" fill="url(#skin)" stroke="#1c192a" stroke-width="2"/>
  <!-- Violet rim highlight -->
  <path d="M88 94 C87 132, 98 159, 120 170" fill="none" stroke="#b78bff" stroke-width="2.8" stroke-linecap="round" opacity="0.82" filter="url(#glow)"/>
  <!-- Clean parted hair -->
  <path d="M78 112 C78 70, 98 48, 128 48 C158 48, 178 70, 178 112 C169 86, 155 74, 134 74 C112 74, 92 84, 78 112 Z" fill="#161522" stroke="#0c0b14" stroke-width="2"/>
  <path d="M81 92 C86 64, 108 48, 136 49" fill="none" stroke="#b78bff" stroke-width="2.4" stroke-linecap="round" opacity="0.75" filter="url(#glow)"/>
  <!-- Composed brows -->
  <path d="M98 104 Q110 101 120 104" fill="none" stroke="#221e30" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M136 104 Q146 101 158 104" fill="none" stroke="#221e30" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Calm analytical eyes -->
  <g class="blink">
    <ellipse cx="109" cy="116" rx="6.5" ry="4" fill="#faf9ff"/>
    <circle cx="109" cy="116" r="3.1" fill="#1d1830"/>
    <circle cx="110.2" cy="114.8" r="1.1" fill="#b78bff"/>
    <ellipse cx="147" cy="116" rx="6.5" ry="4" fill="#faf9ff"/>
    <circle cx="147" cy="116" r="3.1" fill="#1d1830"/>
    <circle cx="148.2" cy="114.8" r="1.1" fill="#b78bff"/>
  </g>
  <!-- Minimalist round wire-frame glasses -->
  <g fill="#b78bff" fill-opacity="0.08" stroke="#d4c4ff" stroke-width="2">
    <circle cx="109" cy="116" r="14"/>
    <circle cx="147" cy="116" r="14"/>
    <path d="M123 116 H133" fill="none"/>
  </g>
  <!-- Nose & serene mouth -->
  <path d="M128 118 L127 136 Q128 139 132 137" fill="none" stroke="#b08066" stroke-width="2" stroke-linecap="round"/>
  <path d="M117 151 Q128 154 139 151" fill="none" stroke="#8f5c4a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Left shoulder violet rim -->
  <path d="M84 194 C68 208, 60 230, 56 256" fill="none" stroke="#b78bff" stroke-width="2.6" opacity="0.72" filter="url(#glow)"/>
</svg>

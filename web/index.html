<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Relay</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="brand" href="#" aria-label="Relay home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 23 C 10 9, 22 9, 27 23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 4.2" />
          <circle cx="5" cy="23" r="3.2" fill="var(--a1)" />
          <circle cx="16" cy="11.6" r="3.2" fill="var(--a2)" />
          <circle cx="27" cy="23" r="3.2" fill="var(--a3)" />
        </svg>
        <span class="brand-word">Relay</span>
      </a>
      <div class="kpis" id="kpis"></div>
      <div class="top-right">
        <div class="channels" id="channels"></div>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="panel mission" data-tab="crew">
        <div class="mission-map">
          <svg id="map" viewBox="0 0 340 342" role="img" aria-label="Crew map: click any assistant to chat or watch live handoffs"></svg>
          <div class="map-caption" id="mapCaption"></div>
        </div>
        <div class="mission-feed">
          <div class="section-head">
            <h2>Live activity</h2>
            <span class="muted small" id="leadLabel"></span>
          </div>
          <ol class="handoffs" id="handoffs"></ol>
        </div>
      </section>

      <section data-tab="crew">
        <div class="section-head pad-x">
          <h2>Your assistants</h2>
          <span class="muted small">Switch models right on each card, or click Settings for limits</span>
        </div>
        <div class="crew" id="crew"></div>
      </section>

      <section data-tab="board">
        <div class="section-head pad-x">
          <h2>Board</h2>
          <span class="muted small" id="boardCount"></span>
        </div>
        <div class="lanes" id="lanes"></div>
      </section>

      <section class="panel ranks" data-tab="ranks">
        <div class="section-head">
          <h2>Who's carrying the team</h2>
          <div class="seg" id="rankSeg" role="tablist">
            <button data-p="today" role="tab">Today</button>
            <button data-p="week" role="tab" class="on">7 days</button>
            <button data-p="all" role="tab">All time</button>
          </div>
        </div>
        <div class="podium" id="podium"></div>
        <div class="rank-table" id="rankTable"></div>
      </section>
    </main>

    <aside class="thread" data-tab="thread" id="threadPane">
      <div class="thread-head">
        <div class="thread-title">
          <h2>Thread</h2>
          <div class="crew-strip" id="crewStrip" aria-label="Active assistants"></div>
        </div>
        <div class="seg small" id="threadFilter">
          <button data-f="all" class="on">All</button>
          <button data-f="web">Web</button>
          <button data-f="telegram">Telegram</button>
          <button data-f="imessage">iMessage</button>
        </div>
      </div>
      <div class="approvals" id="approvals" aria-live="polite"></div>
      <div class="thread-body" id="thread"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="targets" id="targets"></div>
        <div class="active-bar" id="activeBar"></div>
        <div class="slash" id="slash" hidden></div>
        <div class="compose-row">
          <textarea id="input" rows="1" placeholder="Ask anyone…" aria-label="Message"></textarea>
          <button class="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="compose-hint"><kbd>@grok</kbd> one assistant · <kbd>@team</kbd> split the work · <kbd>/</kbd> commands</div>
      </form>
    </aside>

    <nav class="tabbar" id="tabbar">
      <button data-go="thread" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Thread</button>
      <button data-go="crew"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="5" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="19" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 15l3.5-6.5M17 15l-3.5-6.5M7.6 17h8.8" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.5 2"/></svg>Crew</button>
      <button data-go="board"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="5" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="5" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="16.5" y="4" width="4" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Board</button>
      <button data-go="ranks"><svg viewBox="0 0 24 24"><path d="M4 20V13h5v7M9.5 20V8h5v12M15 20v-9h5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Ranks</button>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Assistant settings"></aside>

  <div class="lock" id="lock" hidden>
    <form class="lock-card" id="lockForm">
      <svg class="brand-mark big" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 23 C 10 9, 22 9, 27 23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 4.2" />
        <circle cx="5" cy="23" r="3.2" fill="var(--a1)" /><circle cx="16" cy="11.6" r="3.2" fill="var(--a2)" /><circle cx="27" cy="23" r="3.2" fill="var(--a3)" />
      </svg>
      <h1>Relay is locked</h1>
      <p class="muted">Enter the HUB_TOKEN from your .env file.</p>
      <input id="lockInput" type="password" placeholder="Hub token" autocomplete="current-password" />
      <button class="btn primary" type="submit">Unlock</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <radialGradient id="avBgGrok" cx="50%" cy="38%" r="65%">
        <stop offset="0%" stop-color="#183848" />
        <stop offset="65%" stop-color="#101822" />
        <stop offset="100%" stop-color="#0b0d14" />
      </radialGradient>
      <radialGradient id="avBgMuse" cx="50%" cy="36%" r="65%">
        <stop offset="0%" stop-color="#482124" />
        <stop offset="65%" stop-color="#1d1318" />
        <stop offset="100%" stop-color="#0d0b10" />
      </radialGradient>
      <radialGradient id="avBgHermes" cx="50%" cy="36%" r="65%">
        <stop offset="0%" stop-color="#473715" />
        <stop offset="65%" stop-color="#1c1810" />
        <stop offset="100%" stop-color="#0d0c0a" />
      </radialGradient>
      <radialGradient id="avBgCline" cx="50%" cy="38%" r="65%">
        <stop offset="0%" stop-color="#153c2e" />
        <stop offset="65%" stop-color="#0f1b18" />
        <stop offset="100%" stop-color="#0a0e0d" />
      </radialGradient>
      <radialGradient id="avBgZen" cx="50%" cy="36%" r="65%">
        <stop offset="0%" stop-color="#352052" />
        <stop offset="65%" stop-color="#161124" />
        <stop offset="100%" stop-color="#0b0912" />
      </radialGradient>
      <linearGradient id="avViolet" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d8b8ff" />
        <stop offset="100%" stop-color="#8b5cf6" />
      </linearGradient>
      <linearGradient id="avSkinWarm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f2c4a4" />
        <stop offset="100%" stop-color="#d49674" />
      </linearGradient>
      <linearGradient id="avSkinCool" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#edd0bc" />
        <stop offset="100%" stop-color="#c99d82" />
      </linearGradient>
      <linearGradient id="avSkinOlive" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8bd98" />
        <stop offset="100%" stop-color="#c38e66" />
      </linearGradient>
      <linearGradient id="avVisorCyan" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8cf0ff" stop-opacity="0.88" />
        <stop offset="50%" stop-color="#2cc9eb" stop-opacity="0.62" />
        <stop offset="100%" stop-color="#5ee0ff" stop-opacity="0.85" />
      </linearGradient>
      <linearGradient id="avVisorGold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f6c445" stop-opacity="0.25" />
        <stop offset="50%" stop-color="#ffe28a" stop-opacity="0.92" />
        <stop offset="100%" stop-color="#f6c445" stop-opacity="0.25" />
      </linearGradient>
      <linearGradient id="avSuit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2c2d38" />
        <stop offset="100%" stop-color="#14151c" />
      </linearGradient>
      <linearGradient id="avBotShell" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#353b45" />
        <stop offset="100%" stop-color="#161a20" />
      </linearGradient>
      <linearGradient id="avGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe28a" />
        <stop offset="100%" stop-color="#d89b1c" />
      </linearGradient>
      <linearGradient id="avCoral" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff9b8a" />
        <stop offset="100%" stop-color="#f24f44" />
      </linearGradient>
      <clipPath id="mapAvatarClip" clipPathUnits="objectBoundingBox">
        <circle cx="0.5" cy="0.5" r="0.5" />
      </clipPath>
    </defs>
  </svg>
  <script src="app.js" type="module"></script>
</body>
</html>
